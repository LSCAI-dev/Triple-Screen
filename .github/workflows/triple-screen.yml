name: SGX Triple Screen

on:
  schedule:
    - cron: "30 10 * * 1-5"   # 18:30 SGT Mon-Fri, after SGX close and Yahoo's EOD update
  workflow_dispatch:           # "Run workflow" button for a manual run

permissions:
  contents: write

concurrency:
  group: triple-screen
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run scan and build site
        run: python run.py
      - name: Commit results
        run: |
          git config user.name  "triple-screen-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          git diff --staged --quiet || git commit -m "Scan $(TZ=Asia/Singapore date +'%Y-%m-%d %H:%M') SGT"
          git push
